name: Build and Release

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: NeoForge ${{ matrix.neoforge }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        neoforge: ["26.1.2.109", "26.1.2.115"]
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Verify release automation
        run: python -m unittest discover -s .github/scripts -p "test_*.py"

      - name: Validate version and release notes
        id: version
        run: python .github/scripts/release.py check

      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle and validate wrapper
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Build, package and run GameTests
        env:
          NEOFORGE_VERSION: ${{ matrix.neoforge }}
        run: ./gradlew --no-daemon build releaseArtifacts runGameTestServer "-Pneo_version=$NEOFORGE_VERSION" -PsmokeTests --console=plain

      - name: Install virtual display and software OpenGL
        run: sudo apt-get update && sudo apt-get install -y xvfb libgl1-mesa-dri libglx-mesa0

      - name: Verify book button, HUD and client synchronization
        env:
          NEOFORGE_VERSION: ${{ matrix.neoforge }}
          LIBGL_ALWAYS_SOFTWARE: "true"
          ALSOFT_DRIVERS: "null"
        run: >-
          xvfb-run -a --server-args="-screen 0 1280x720x24"
          ./gradlew --no-daemon runClientSmoke
          "-Pneo_version=$NEOFORGE_VERSION" -PsmokeTests --console=plain

      - name: Upload release artifacts
        if: matrix.neoforge == '26.1.2.109'
        uses: actions/upload-artifact@v7
        with:
          name: thaumictracker-${{ steps.version.outputs.version }}
          path: build/release/*
          if-no-files-found: error

      - name: Upload diagnostic logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: logs-neoforge-${{ matrix.neoforge }}
          path: |
            run-gametest/logs/
            run-smoke-client/logs/
            run-gametest/crash-reports/
            run-smoke-client/crash-reports/
            run-smoke-client/screenshots/
            build/reports/
          if-no-files-found: ignore

  release:
    name: Publish GitHub release
    needs: build
    if: >-
      github.event_name != 'pull_request' &&
      (github.ref == format('refs/heads/{0}', github.event.repository.default_branch) ||
       startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: thaumictracker-release
      cancel-in-progress: false
    steps:
      - name: Checkout release source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download tested release artifacts
        uses: actions/download-artifact@v8
        with:
          name: thaumictracker-${{ needs.build.outputs.version }}
          path: release

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Publish or replace this version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python .github/scripts/release.py publish
