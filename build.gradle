plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}
version = mod_version
group = mod_group_id
base { archivesName = "${mod_id}-${minecraft_version}" }
java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
    withSourcesJar()
}
sourceSets {
    smoke {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
}
repositories {
    mavenCentral()
    maven { url = 'https://cursemaven.com'; content { includeGroup 'curse.maven' } }
}
neoForge {
    version = neo_version
    runs {
        client { client() }
        server { server(); programArgument '--nogui' }
        gameTestServer {
            type = 'gameTestServer'
            gameDirectory = file('run-gametest')
            systemProperty 'thaumictracker.gameTests', 'true'
        }
        clientSmoke {
            client()
            gameDirectory = file('run-smoke-client')
            systemProperty 'thaumictracker.clientSmoke', 'true'
        }
        configureEach { logLevel = org.slf4j.event.Level.INFO }
    }
    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
            if (providers.gradleProperty('smokeTests').isPresent()) sourceSet(sourceSets.smoke)
        }
    }
}
dependencies {
    implementation "curse.maven:thaumaturge-1628024:${thaumaturge_file_id}"
    runtimeOnly 'curse.maven:curios-309927:8463519'
    runtimeOnly 'curse.maven:lithostitched-936015:8944658'
    runtimeOnly 'curse.maven:better-advanced-tooltips-1637623:8568911'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
def generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    def replaceProperties = [minecraft_version_range: minecraft_version_range,
        neo_version_range: neo_version_range, mod_id: mod_id, mod_name: mod_name,
        mod_license: mod_license, mod_version: mod_version, mod_authors: mod_authors,
        mod_description: mod_description]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}
sourceSets.main.resources.srcDir generateModMetadata
sourceSets.test.runtimeClasspath += sourceSets.main.compileClasspath
neoForge.ideSyncTask generateModMetadata
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
tasks.named('test') { useJUnitPlatform() }

tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

tasks.register('releaseZip', Zip) {
    archiveFileName = "Thaumic-Tracker-${mod_version}.zip"
    destinationDirectory = layout.buildDirectory.dir('distributions')
    from(tasks.named('jar')) { into 'mods' }
    from('README.md')
    from('docs') { into 'docs' }
}

// Stage only the current version, even if build/libs contains older builds.
tasks.register('releaseArtifacts', Sync) {
    from tasks.named('jar'), tasks.named('sourcesJar'), tasks.named('releaseZip')
    into layout.buildDirectory.dir('release')
}
