name: Build and Release

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: NeoForge ${{ matrix.neoforge }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        neoforge: ["26.1.2.109", "26.1.2.115"]
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      stem: ${{ steps.version.outputs.stem }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Read and validate mod version
        id: version
        shell: python
        run: |
          import os
          import re
          from pathlib import Path

          properties = dict(line.split("=", 1) for line in Path("gradle.properties").read_text().splitlines()
                            if "=" in line and not line.lstrip().startswith("#"))
          version = properties["mod_version"].strip()
          mod_id = properties["mod_id"].strip()
          minecraft = properties["minecraft_version"].strip()
          assert re.fullmatch(r"[0-9]+(?:\.[0-9]+)+(?:-[A-Za-z0-9][A-Za-z0-9.-]*)?", version), "Invalid mod_version"
          assert re.fullmatch(r"[a-z][a-z0-9_]*", mod_id), "Invalid mod_id"
          assert re.fullmatch(r"[0-9]+(?:\.[0-9]+)+", minecraft), "Invalid minecraft_version"
          tag = f"v{version}"
          if os.environ["GITHUB_REF"].startswith("refs/tags/"):
              assert os.environ["GITHUB_REF_NAME"] == tag, "Tag must match mod_version in gradle.properties"
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"version={version}\ntag={tag}\nstem={mod_id}-{minecraft}-{version}\n")

      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle and validate wrapper
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Build, package and run GameTests
        env:
          NEOFORGE_VERSION: ${{ matrix.neoforge }}
        run: ./gradlew --no-daemon build releaseArtifacts runGameTestServer "-Pneo_version=$NEOFORGE_VERSION" -PsmokeTests --console=plain

      - name: Install virtual display and software OpenGL
        run: sudo apt-get update && sudo apt-get install -y xvfb libgl1-mesa-dri libglx-mesa0

      - name: Verify book button, HUD and client synchronization
        env:
          NEOFORGE_VERSION: ${{ matrix.neoforge }}
          LIBGL_ALWAYS_SOFTWARE: "true"
          ALSOFT_DRIVERS: "null"
        run: >-
          xvfb-run -a --server-args="-screen 0 1280x720x24"
          ./gradlew --no-daemon runClientSmoke
          "-Pneo_version=$NEOFORGE_VERSION" -PsmokeTests --console=plain

      - name: Upload release artifacts
        if: matrix.neoforge == '26.1.2.109'
        uses: actions/upload-artifact@v7
        with:
          name: thaumictracker-${{ steps.version.outputs.version }}
          path: build/release/*
          if-no-files-found: error

      - name: Upload diagnostic logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: logs-neoforge-${{ matrix.neoforge }}
          path: |
            run-gametest/logs/
            run-smoke-client/logs/
            run-gametest/crash-reports/
            run-smoke-client/crash-reports/
            run-smoke-client/screenshots/
            build/reports/
          if-no-files-found: ignore

  release:
    name: Publish GitHub release
    needs: build
    if: >-
      github.event_name != 'pull_request' &&
      (github.ref == format('refs/heads/{0}', github.event.repository.default_branch) ||
       startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: release-${{ needs.build.outputs.tag }}
      cancel-in-progress: false
    steps:
      - name: Checkout release source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download tested release artifacts
        uses: actions/download-artifact@v8
        with:
          name: thaumictracker-${{ needs.build.outputs.version }}
          path: release

      - name: Publish new version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MOD_VERSION: ${{ needs.build.outputs.version }}
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
          RELEASE_STEM: ${{ needs.build.outputs.stem }}
        shell: bash
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; keeping the published version."
            exit 0
          fi
          if git rev-parse --verify --quiet "refs/tags/$RELEASE_TAG" >/dev/null; then
            tag_commit="$(git rev-list -n 1 "$RELEASE_TAG")"
            if [ "$tag_commit" != "$(git rev-parse "$GITHUB_SHA^{commit}")" ]; then
              echo "Existing tag $RELEASE_TAG points to a different commit." >&2
              exit 1
            fi
          fi
          gh release create "$RELEASE_TAG" \
            "release/$RELEASE_STEM.jar" \
            "release/$RELEASE_STEM-sources.jar" \
            "release/Thaumic-Tracker-$MOD_VERSION.zip" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Thaumic Tracker $MOD_VERSION" \
            --target "$GITHUB_SHA" \
            --generate-notes

